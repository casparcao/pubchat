version: '3.8'

services:
  user:
    build:
      context: ../user
      dockerfile: Dockerfile
    container_name: pubchat-user
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:root@mysql:3306/user
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_ADDR=amqp://admin:admin@rabbitmq:5672/pubchat_vhost
      - JWT_SECRET=iloverustlangitsveryverynice
      - ACCESS_PRIVATE_KEY=pubchat_access_private_key
    depends_on:
      - mysql
      - redis
      - rabbitmq
    restart: unless-stopped

volumes:
  user_data:
    driver: local