version: '3.8'

services:
  session:
    build:
      context: ../session
      dockerfile: Dockerfile
    container_name: pubchat-session
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=mysql://root:root@mysql:3306/session
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_ADDR=amqp://admin:admin@rabbitmq:5672/pubchat_vhost
      - JWT_SECRET=iloverustlangitsveryverynice
      - ACCESS_PRIVATE_KEY=pubchat_access_private_key
    depends_on:
      - mysql
      - redis
      - rabbitmq
    restart: unless-stopped

volumes:
  session_data:
    driver: local